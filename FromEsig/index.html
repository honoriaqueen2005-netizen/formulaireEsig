<!DOCTYPE html>
<html lang="fr">
<head>

<link rel="stylesheet" href="./filiere.css">
<body>
    <section>
        <h1>Choix_Filière</h1>
        <form action="/#">

        <select name="filiere" id="filiere">
            <option value="">Choix_Filière</option>
            <option value="info">Système Réseau Informatique(SRI)</option>
             <option value="info">Sécurité Informatique(SI)</option>
            <option value="Info">Développement d'Applications(DA)</option>
             
              <option value="com">Commerce Internationale(CI)</option>
               <option value="Cons">Génie Mécanique(GI)</option>
            <option value="eco">Contabilité Contrôle Audit(CCA)</option>
            <option value="log">Transports Logistics(TPL)</option>
            <option value="ind">Informatique Industrielle(II)</option>
             <option value="Mec">Génie Mécanique(GM)</option>
             <option value="Org">OGRH</option>
        </select>
        <label for="Salle">Salle</label>
        <input type="text" placeholder="nom de la salle">
        <label for="number">Effectif</label>
        <input type="Effectif" placeholder="effectif de la salle">

        
        <input type="submit" value="Enregistrer">
        </form>
